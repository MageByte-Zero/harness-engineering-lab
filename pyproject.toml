[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-harness-lab"
version = "0.1.0"
description = "Incremental repository-reading Agent application lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "openai>=3.31.0",
    "openai-agents==0.24.0",
    "pydantic==2.12.5",
    "python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
